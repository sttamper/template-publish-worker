spring:
  application:
    name: template-publish-worker
  datasource:
    url: jdbc:postgresql://localhost:5432/cwtask-sandbox-db
    username: admin
    password: admin
  flyway:
    enabled: true
    schemas: engagement-mgmt-sch
    default-schema: engagement-mgmt-sch
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
      isolation-level-for-create: read_committed
  kafka:
    bootstrap-servers: localhost:9093
    listener:
      ack-mode: manual_immediate
    consumer:
      enable-auto-commit: false
      group-id: template-publish-worker
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.cwtask.worker.domain.events.CurrentVersionChanged
        spring.json.use.type.headers: false
